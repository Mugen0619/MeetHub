; 本番用のPHP設定
expose_php = Off
memory_limit = 256M
display_errors = Off
log_errors = On

; 画像はブラウザからS3へ直接アップロードされる(Livewireの署名付きURL)ため、アプリ側でのアップロード上限は小さくてよい
upload_max_filesize = 12M
post_max_size = 13M

; コードはイメージに含まれ実行中に変わらないため、ファイルの更新確認を無効にする
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

realpath_cache_size = 4096K
realpath_cache_ttl = 600
