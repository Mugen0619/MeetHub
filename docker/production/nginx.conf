# 本番用のNginx設定。ALB(HTTP)からのリクエストを受け、静的ファイルは直接返し、それ以外はPHP-FPMへ渡す。
server {
    listen 8080 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    charset utf-8;

    # アクセスログはLaravel側で構造化して出力する(http request completed)ため、Nginxでは出さない。
    # エラーログは標準エラー出力(CloudWatch Logs)へ出す
    access_log off;
    error_log /dev/stderr warn;

    # 画像本体はブラウザからS3へ直接アップロードされるため、アプリへのリクエストボディは小さい
    client_max_body_size 13m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Viteのビルド成果物はファイル名にハッシュを含むため、長期間キャッシュさせる(CloudFrontでもキャッシュする)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # index.php以外のPHPファイル・ドットファイル(.env等)は実行・公開しない
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
