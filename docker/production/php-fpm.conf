; 本番用のPHP-FPM設定(公式イメージの docker.conf / zz-docker.conf を上書きする)。
; 公式イメージの設定で、ワーカーの標準エラー出力(Laravelのjson_stderrログ)は加工されずにコンテナの標準エラー出力へ流れ、
; 環境変数(ECSタスク定義で渡すDB接続情報等)もワーカーへ引き継がれる(clear_env = no)。

[global]
; 1行が長い(スタックトレースを含む)JSONログが途中で分割されないよう、1行の上限を引き上げる(既定は8192バイト)
log_limit = 65536

[www]
; ワーカー数を固定する。ログイン処理(bcrypt)はCPUを使い切るため、ワーカーを増やしてもvCPU数以上には並列に処理できず、
; 待ち時間が各ワーカーに分散して全体が遅くなるだけになる。タスクのvCPUに見合った数を環境変数で指定する(docs/infrastructure.md)
pm = static
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
; メモリリークの影響を抑えるため、一定数のリクエストを処理したワーカーは作り直す
pm.max_requests = 500

; アクセスログはLaravel側で構造化して出力する(http request completed)ため、PHP-FPMのアクセスログは出さない
access.log = /dev/null
