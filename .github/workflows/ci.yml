name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # 同時実行制御(行ロック)のテストを本番と同じPostgreSQLで実行するためのDB(phpunit.pgsql.xmlで使用)
    services:
      pgsql:
        image: postgres:17
        env:
          POSTGRES_DB: meethub_testing
          POSTGRES_USER: meethub
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meethub -d meethub_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, bcmath, gd, zip, intl, pdo, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Check code style (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run tests (Pest)
        run: php artisan test

      - name: Run tests on PostgreSQL (Pest, including concurrency tests)
        env:
          # .envのDB_HOST(docker-composeのサービス名 pgsql)ではなく、CIのサービスコンテナに接続する
          DB_HOST: 127.0.0.1
        run: ./vendor/bin/pest --configuration=phpunit.pgsql.xml
