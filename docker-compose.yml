services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      - pgsql
    tty: true

  pgsql:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-meethub}
      POSTGRES_USER: ${DB_USERNAME:-meethub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data

volumes:
  pgsql-data:
